basePath: /api
definitions:
  agent.BackupSchedule:
    properties:
      interval_minutes:
        description: 0 = disabled
        type: integer
      last_backup_path:
        type: string
      last_run_at:
        description: updated on every successful run
        type: string
      last_status:
        description: '"ok" or "error: ..."'
        type: string
      passphrase:
        description: optional - if set, every scheduled backup is JETTY-ENC-V1 wrapped
        type: string
      retention:
        description: keep this many on-disk backups (0 = unlimited)
        type: integer
      updated_at:
        description: when the schedule itself was last changed
        type: string
    type: object
  agent.BulkRequest:
    properties:
      action:
        example: stop
        type: string
      all:
        type: boolean
      names:
        example:
        - nginx
        - redis
        items:
          type: string
        type: array
      tag:
        example: prod
        type: string
    type: object
  agent.BulkResponse:
    properties:
      results:
        additionalProperties:
          $ref: '#/definitions/agent.BulkResponseEntry'
        type: object
      selected:
        items:
          type: string
        type: array
    type: object
  agent.BulkResponseEntry:
    properties:
      error:
        type: string
      ok:
        type: boolean
    type: object
  agent.CreateTokenRequest:
    properties:
      note:
        example: for arnold's laptop
        type: string
      ttl_seconds:
        example: 3600
        type: integer
    type: object
  agent.CreateTokenResponse:
    properties:
      expires_at:
        example: "2026-04-30T03:00:00Z"
        type: string
      note:
        example: for arnold's laptop
        type: string
      token:
        example: H8mC...43-char-base64...
        type: string
    type: object
  agent.DeletedEnvKey:
    properties:
      key:
        description: The name of the deleted env key
        type: string
      version:
        description: Timestamp when deleted
        type: integer
    type: object
  agent.DeletedWorkload:
    properties:
      ip:
        description: The IP of the deleted workload
        type: string
      version:
        description: Timestamp when deleted (must be > workload version to take effect)
        type: integer
    type: object
  agent.EnvGetResponse:
    properties:
      key:
        example: DB_PASSWORD
        type: string
      value:
        example: secret123
        type: string
    type: object
  agent.EnvListResponse:
    properties:
      count:
        example: 3
        type: integer
      keys:
        example:
        - DB_HOST
        - DB_PASSWORD
        - API_KEY
        items:
          type: string
        type: array
    type: object
  agent.EnvSetRequest:
    properties:
      env:
        additionalProperties:
          type: string
        example:
          DB_HOST: localhost
          DB_PASSWORD: secret123
        type: object
    type: object
  agent.EnvSetResponse:
    properties:
      added:
        example:
        - DB_HOST
        - DB_PASSWORD
        items:
          type: string
        type: array
      updated:
        example:
        - API_KEY
        items:
          type: string
        type: array
    type: object
  agent.ErrorResponse:
    properties:
      error:
        example: workload not found
        type: string
    type: object
  agent.HealthResponse:
    properties:
      cluster_status:
        description: Cluster health fields (when no filter or multiple nodes)
        example: healthy
        type: string
      healthy_nodes:
        example: 3
        type: integer
      id:
        example: abc123def456
        type: string
      ip:
        example: 100.96.0.1
        type: string
      name:
        example: node1
        type: string
      nodes:
        items:
          $ref: '#/definitions/agent.NodeHealthStatus'
        type: array
      public_ip:
        example: 203.0.113.1
        type: string
      status:
        description: Local health fields (when ?node=local or single node response)
        example: healthy
        type: string
      system:
        additionalProperties: true
        type: object
      timestamp:
        example: "2024-01-02T15:04:05Z"
        type: string
      total_nodes:
        example: 3
        type: integer
      total_workloads:
        example: 10
        type: integer
      workloads_local:
        example:
        - nginx:10.100.0.50:running
        items:
          type: string
        type: array
      workloads_total:
        example: 5
        type: integer
    type: object
  agent.HostComposeProject:
    properties:
      containers:
        items:
          $ref: '#/definitions/agent.HostContainer'
        type: array
      managed_by_jetty:
        type: boolean
      name:
        type: string
      workload_name:
        description: populated when managed_by_jetty
        type: string
    type: object
  agent.HostContainer:
    properties:
      compose_project:
        type: string
      compose_service:
        type: string
      created_at:
        description: unix seconds
        type: integer
      id:
        description: short ID
        type: string
      image:
        description: image:tag
        type: string
      managed_by_jetty:
        type: boolean
      name:
        description: primary container name (without leading /)
        type: string
      ports:
        description: e.g. "0.0.0.0:80->80/tcp"
        items:
          type: string
        type: array
      state:
        description: '"running", "exited", "paused", ...'
        type: string
      status:
        description: human-readable e.g. "Up 5 hours"
        type: string
      workload_name:
        description: populated when managed_by_jetty
        type: string
    type: object
  agent.HostExecRequest:
    properties:
      command:
        description: shell -c argument; the whole string is one command line
        type: string
      timeout:
        description: seconds; default 30, max 300
        type: integer
    type: object
  agent.HostExecResponse:
    properties:
      duration_ms:
        type: integer
      exit_code:
        type: integer
      node:
        type: string
      stderr:
        type: string
      stdout:
        type: string
      timed_out:
        type: boolean
    type: object
  agent.ImportReport:
    properties:
      created:
        type: integer
      entries:
        items:
          $ref: '#/definitions/agent.ImportReportEntry'
        type: array
      errors:
        type: integer
      mode:
        type: string
      skipped:
        type: integer
      total:
        type: integer
    type: object
  agent.ImportReportEntry:
    properties:
      assigned_ip:
        type: string
      detail:
        type: string
      name:
        type: string
      original_ip:
        type: string
      status:
        example: imported
        type: string
    type: object
  agent.ImportRequest:
    properties:
      mode:
        example: skip
        type: string
      payload:
        $ref: '#/definitions/agent.PortableExport'
      reassign_ips:
        type: boolean
    type: object
  agent.JoinRequest:
    properties:
      arch:
        example: amd64
        type: string
      id:
        type: string
      ip:
        example: 100.96.0.5
        type: string
      name:
        type: string
      secret:
        type: string
      version:
        example: 2.0.0
        type: string
    type: object
  agent.JoinResponse:
    properties:
      cf_token:
        type: string
      peers:
        items:
          $ref: '#/definitions/agent.Peer'
        type: array
      service_cidr:
        example: 10.100.0.0/16
        type: string
      tunnel_domain:
        type: string
      warp_token:
        type: string
      workloads:
        items:
          $ref: '#/definitions/agent.Workload'
        type: array
    type: object
  agent.JoinToken:
    properties:
      created_at:
        description: When minted
        type: string
      expires_at:
        description: After this, refused even if unused
        type: string
      id:
        description: Random hex; the token value itself
        type: string
      note:
        description: Free-form ("for arnold's laptop")
        type: string
      used:
        description: True after a successful join consumed it
        type: boolean
      used_at:
        description: When consumed
        type: string
      used_by:
        description: Joining peer's ID (audit)
        type: string
    type: object
  agent.ListTokensResponse:
    properties:
      tokens:
        items:
          $ref: '#/definitions/agent.JoinToken'
        type: array
    type: object
  agent.MoveRequest:
    properties:
      to:
        example: node2
        type: string
    type: object
  agent.NodeHealthStatus:
    properties:
      error:
        type: string
      healthy:
        example: true
        type: boolean
      id:
        example: abc123def456
        type: string
      ip:
        example: 100.96.0.1
        type: string
      name:
        example: node1
        type: string
      public_ip:
        example: 203.0.113.1
        type: string
      status:
        example: healthy
        type: string
      system:
        additionalProperties: true
        type: object
      workloads:
        items:
          type: string
        type: array
    type: object
  agent.NodeInfo:
    properties:
      arch:
        example: amd64
        type: string
      id:
        example: abc123def456
        type: string
      ip:
        example: 100.96.0.1
        type: string
      name:
        example: node1
        type: string
    type: object
  agent.NodeUpdateRequest:
    properties:
      image:
        example: ghcr.io/ncwardell/jetty:2.1.0
        type: string
    type: object
  agent.NodeUpdateResponse:
    properties:
      image:
        example: ghcr.io/ncwardell/jetty:2.1.0
        type: string
      message:
        example: pulling image and restarting
        type: string
      status:
        example: updating
        type: string
    type: object
  agent.Peer:
    properties:
      arch:
        description: CPU architecture (amd64, arm64, etc.)
        type: string
      healthy:
        type: boolean
      id:
        description: HWID (hardware ID)
        type: string
      ip:
        description: WARP IP (100.96.x.x) - primary address for node communication
        type: string
      last_seen:
        type: string
      name:
        description: Hostname
        type: string
      version:
        description: Agent version
        type: string
    type: object
  agent.PortableExport:
    properties:
      exported_at:
        example: "2026-04-30T03:00:00Z"
        type: string
      referenced_env_keys:
        example:
        - DATABASE_URL
        - API_KEY
        items:
          type: string
        type: array
      version:
        example: "1"
        type: string
      workloads:
        items:
          $ref: '#/definitions/agent.PortableWorkload'
        type: array
    type: object
  agent.PortableWorkload:
    properties:
      allowed_nodes:
        items:
          type: string
        type: array
      autostart:
        type: boolean
      compose:
        type: string
      compose_amd64:
        type: string
      compose_arm64:
        type: string
      ip:
        example: 10.100.0.10
        type: string
      name:
        example: nginx
        type: string
      revive:
        type: boolean
      tags:
        example:
        - prod
        - web
        items:
          type: string
        type: array
    type: object
  agent.RegistryAuth:
    properties:
      registry:
        description: Registry host, e.g. "ghcr.io"
        type: string
      token_ref:
        description: Env-store key holding the token/PAT
        type: string
      username:
        description: Registry username; defaults to "x-access-token" for PATs
        type: string
    type: object
  agent.RevokeTokenResponse:
    properties:
      revoked:
        type: boolean
    type: object
  agent.RotateAdminKeyRequest:
    properties:
      new_key:
        type: string
    type: object
  agent.RotateAdminKeyResponse:
    properties:
      hint:
        type: string
      new_key:
        type: string
      status:
        example: rotated
        type: string
    type: object
  agent.RotatePeerKeyResponse:
    properties:
      hint:
        type: string
      peer_id:
        type: string
      status:
        example: rotated
        type: string
    type: object
  agent.StatusResponse:
    properties:
      node:
        $ref: '#/definitions/agent.NodeInfo'
      peers:
        items:
          $ref: '#/definitions/agent.Peer'
        type: array
      service_cidr:
        example: 10.100.0.0/16
        type: string
      tunnel:
        $ref: '#/definitions/agent.TunnelStatus'
      warp:
        $ref: '#/definitions/agent.WarpStatus'
      workloads:
        items:
          $ref: '#/definitions/agent.Workload'
        type: array
    type: object
  agent.SyncResponse:
    properties:
      deleted_env_keys:
        items:
          $ref: '#/definitions/agent.DeletedEnvKey'
        type: array
      deleted_workloads:
        items:
          $ref: '#/definitions/agent.DeletedWorkload'
        type: array
      env_data:
        additionalProperties:
          type: string
        type: object
      workloads:
        items:
          $ref: '#/definitions/agent.Workload'
        type: array
    type: object
  agent.TunnelRequest:
    properties:
      token:
        example: eyJhIjoiNjA2...
        type: string
    type: object
  agent.TunnelStatus:
    properties:
      configured:
        example: true
        type: boolean
      running:
        example: true
        type: boolean
    type: object
  agent.WarpStatus:
    properties:
      enabled:
        example: true
        type: boolean
      ip:
        example: 100.96.0.20
        type: string
    type: object
  agent.Workload:
    properties:
      allowed_nodes:
        description: 'Node whitelist: empty/["*"] = all, otherwise node names/IDs'
        items:
          type: string
        type: array
      autostart:
        description: Auto-start when Jetty starts up
        type: boolean
      compose:
        description: Default compose (used if no arch-specific)
        type: string
      compose_amd64:
        description: 'Optional: amd64-specific compose'
        type: string
      compose_arm64:
        description: 'Optional: arm64-specific compose'
        type: string
      ip:
        description: Service IP (routed via WARP)
        type: string
      name:
        description: DNS hostname
        type: string
      owner:
        description: Node HWID
        type: string
      registry_auth:
        allOf:
        - $ref: '#/definitions/agent.RegistryAuth'
        description: |-
          RegistryAuth optionally authenticates this workload's image pull
          against a private registry. The token itself is never stored here -
          TokenRef names a key in the encrypted env store whose value is the
          registry password/PAT. When nil, pulls run with no Jetty-managed
          credentials (public images, or whatever the host docker config
          already provides) - identical to pre-feature behavior.
      revive:
        description: Auto-failover to another node if owner dies
        type: boolean
      tags:
        description: |-
          Tags group workloads for filtering and bulk operations (start
          all tagged "media", export all tagged "prod", etc.). Free-form
          strings; validated with validTagPattern. Sorted+deduped on
          ingest so the wire form is canonical.
        items:
          type: string
        type: array
      version:
        description: Unix timestamp
        type: integer
    type: object
  agent.WorkloadRequest:
    properties:
      allowed_nodes:
        example:
        - node1
        - node2
        items:
          type: string
        type: array
      autostart:
        example: true
        type: boolean
      compose:
        example: |-
          services:
            web:
              image: nginx
        type: string
      compose_amd64:
        example: |-
          services:
            web:
              image: nginx:amd64
        type: string
      compose_arm64:
        example: |-
          services:
            web:
              image: nginx:arm64
        type: string
      ip:
        example: 10.100.0.50
        type: string
      name:
        example: nginx
        type: string
      registry_auth:
        $ref: '#/definitions/agent.RegistryAuth'
      revive:
        example: true
        type: boolean
    type: object
info:
  contact:
    name: Jetty Support
    url: https://github.com/ncwardell/jetty
  description: P2P Docker Compose orchestration with Cloudflare WARP mesh networking
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Jetty API
  version: "2.0"
paths:
  /admin-key/rotate:
    post:
      consumes:
      - application/json
      description: Generates (or accepts) a new admin key, persists it on this node,
        and broadcasts it via memberlist so every peer adopts it. Returns the new
        key in the response. Admin only.
      parameters:
      - description: Rotation parameters (new_key optional - server generates if absent)
        in: body
        name: request
        schema:
          $ref: '#/definitions/agent.RotateAdminKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agent.RotateAdminKeyResponse'
        "400":
          description: Invalid new key
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
        "401":
          description: Admin auth required
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Rotate the cluster admin key
      tags:
      - admin
  /backup:
    get:
      description: Returns a tar.gz of state.json + compose dir + warp dir. If X-Backup-Passphrase
        header is set, the tar.gz is wrapped with Argon2id+AES-GCM into the JETTY-ENC-V1
        format - safe to share/store. Without the header, output is plain tar.gz (full
        credentials in the clear).
      parameters:
      - description: Optional passphrase. If present, the response body is JETTY-ENC-V1
          wrapped instead of plain tar.gz.
        in: header
        name: X-Backup-Passphrase
        type: string
      produces:
      - application/gzip
      responses:
        "200":
          description: tar.gz archive (or JETTY-ENC-V1 blob if passphrase set)
          schema:
            type: file
      summary: Download a backup of cluster state
      tags:
      - backup
  /backup/schedule:
    delete:
      description: Removes the cluster's scheduled-backup config. Existing backup
        files on disk are not deleted. Admin only.
      responses:
        "204":
          description: No Content
      summary: Disable scheduled backups
      tags:
      - backup
    get:
      description: Returns the cluster's current backup schedule (or null if disabled).
        Admin only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agent.BackupSchedule'
      summary: Read the scheduled-backup config
      tags:
      - backup
    post:
      consumes:
      - application/json
      description: 'Admin-only. Body fields: interval_minutes (>=5), retention (0=unlimited),
        passphrase (optional, JETTY-ENC-V1 wraps every backup if set).'
      parameters:
      - description: Schedule
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/agent.BackupSchedule'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agent.BackupSchedule'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Create or update the scheduled-backup config
      tags:
      - backup
  /env:
    get:
      description: Returns all stored environment variable keys (values are encrypted)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agent.EnvListResponse'
      summary: List environment variables
      tags:
      - env
    post:
      consumes:
      - application/json
      description: Stores encrypted environment variables (existing keys are overwritten)
      parameters:
      - description: Environment variables to set
        in: body
        name: env
        required: true
        schema:
          $ref: '#/definitions/agent.EnvSetRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agent.EnvSetResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
        "500":
          description: Encryption error
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Set environment variables
      tags:
      - env
  /env/{key}:
    delete:
      description: Removes an environment variable from storage
      parameters:
      - description: Environment variable key
        in: path
        name: key
        required: true
        type: string
      responses:
        "204":
          description: Variable deleted
        "404":
          description: Key not found
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Delete environment variable
      tags:
      - env
    get:
      description: Returns the decrypted value of a specific environment variable
      parameters:
      - description: Environment variable key
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agent.EnvGetResponse'
        "404":
          description: Key not found
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
        "500":
          description: Decryption error
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Get environment variable
      tags:
      - env
  /health:
    get:
      description: Returns health status of this node or the entire cluster. Use node=local
        for just this node.
      parameters:
      - description: 'Filter by node: ''local'' for this node only, or node name/ID
          for specific node'
        in: query
        name: node
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agent.HealthResponse'
      summary: Health check
      tags:
      - cluster
  /heartbeat:
    post:
      consumes:
      - application/json
      description: Node-to-node liveness used in tunnel mode, where peers cannot reach
        each other directly over WARP. Refreshes the sender's LastSeen. Peer API key
        required.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Peer liveness ping (internal)
      tags:
      - internal
  /host/compose:
    get:
      description: Returns containers grouped by compose project. Standalone containers
        (no compose project) are grouped under an empty project name. Pass ?node=<id|name>
        to query a peer.
      parameters:
      - description: Peer ID or name; defaults to this node
        in: query
        name: node
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/agent.HostComposeProject'
            type: array
      summary: List Docker compose projects on this node
      tags:
      - host
  /host/containers:
    get:
      description: Returns every container on the host, including those not managed
        by Jetty. The agent's own container is excluded. Pass ?node=<id|name> to query
        a peer instead - useful when the dashboard is loaded via a shared Cloudflare
        tunnel and lands on whichever node Cloudflare picks.
      parameters:
      - description: Peer ID or name; defaults to this node
        in: query
        name: node
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/agent.HostContainer'
            type: array
      summary: List all Docker containers on this node
      tags:
      - host
  /host/exec:
    post:
      consumes:
      - application/json
      description: One-shot exec. Requires JETTY_HOST_SHELL=true on the target agent
        and AdminKey auth. ?node=<id|name> proxies to a peer.
      parameters:
      - description: Peer ID or name; defaults to this node
        in: query
        name: node
        type: string
      - description: Command to run
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/agent.HostExecRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agent.HostExecResponse'
      summary: Run one command on the host and return its output
      tags:
      - terminal
  /host/shell:
    get:
      description: 'Upgrades to a WebSocket and runs an interactive shell. With --pid=host
        on the docker run, this is a true host shell via nsenter. Without it, the
        shell runs inside the agent container and a banner explains the limitation.
        DISABLED by default. Set JETTY_HOST_SHELL=true to enable. Auth: ?api_key=<secret>
        or X-API-Key header.'
      parameters:
      - description: Shell to run (default /bin/bash, falls back to /bin/sh)
        in: query
        name: shell
        type: string
      responses: {}
      summary: Open a shell on the host (WebSocket)
      tags:
      - terminal
  /join:
    post:
      consumes:
      - application/json
      description: Allows a new node to join the cluster using the cluster secret
      parameters:
      - description: Join request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/agent.JoinRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agent.JoinResponse'
        "401":
          description: Invalid secret
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
        "409":
          description: Mesh IP collision
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Join cluster
      tags:
      - cluster
  /nodes:
    get:
      description: Returns all nodes in the cluster (self + peers)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/agent.Peer'
            type: array
      summary: List all nodes
      tags:
      - nodes
  /nodes/{id}:
    delete:
      description: Removes a peer node from the cluster. Workloads owned by that node
        will be orphaned and eligible for failover if revive is enabled.
      parameters:
      - description: Node ID (HWID) or name
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Cannot remove self
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
        "404":
          description: Node not found
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Remove a node from the cluster
      tags:
      - nodes
  /nodes/{id}/update:
    post:
      consumes:
      - application/json
      description: Triggers a self-update of the node by pulling a new Docker image
        and restarting. Only works on the target node itself - requests to other nodes
        will be proxied.
      parameters:
      - description: Node ID (HWID), name, or 'self'
        in: path
        name: id
        required: true
        type: string
      - description: Update request with image to pull
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/agent.NodeUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agent.NodeUpdateResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
        "404":
          description: Node not found
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
        "500":
          description: Update failed
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Update a node (self-update)
      tags:
      - nodes
  /peer-announce:
    post:
      consumes:
      - application/json
      description: Node-to-node. A peer reports its identity, WARP IP, version and
        architecture so the receiver can add or refresh it in the peer table. Peer
        API key required.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Announce a peer's current address and state (internal)
      tags:
      - internal
  /peers/{id}/rotate-key:
    post:
      description: Admin-only. Forces the named peer to regenerate its outbound peer
        credential. The peer itself owns the key, so the request is proxied to the
        target node when needed. After rotation gossip propagates, the old key is
        invalid cluster-wide.
      parameters:
      - description: Peer HWID or hostname (use 'self' for this node)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agent.RotatePeerKeyResponse'
        "401":
          description: Admin auth required
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
        "404":
          description: Peer not found
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Rotate a peer's SelfAPIKey
      tags:
      - admin
  /proxy/{ip}/{path}:
    get:
      description: Forwards to a workload by its mesh IP, so a workload's own HTTP
        endpoint is reachable through the cluster API without exposing it publicly.
        Local workloads are dialled directly; remote ones go over the mesh. Cluster
        credentials are stripped before forwarding so a workload never sees the caller's
        API key. HTTP only - WebSocket upgrades are not proxied.
      parameters:
      - description: Workload mesh IP, e.g. 10.100.0.50
        in: path
        name: ip
        required: true
        type: string
      - description: Path on the workload
        in: path
        name: path
        type: string
      responses:
        "200":
          description: Response from the workload, passed through
        "404":
          description: No workload with that mesh IP
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
        "502":
          description: Workload unreachable
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Proxy an HTTP request to a workload
      tags:
      - workloads
  /restore:
    post:
      consumes:
      - application/gzip
      description: Accepts a tar.gz produced by /api/backup and overwrites state.json
        and the compose directory. Destructive. Restart the agent after restore to
        pick up the new state.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: invalid archive
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Restore cluster state from a backup
      tags:
      - backup
  /status:
    get:
      description: Returns full cluster status including node info, peers, workloads,
        and connectivity status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agent.StatusResponse'
      summary: Get cluster status
      tags:
      - cluster
  /sync:
    get:
      description: Node-to-node pull used as the backstop when memberlist gossip is
        unavailable. Returns every workload, deletion tombstone, env value and env
        tombstone so a peer can merge by highest-version-wins. Peer API key required.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agent.SyncResponse'
      summary: Full replicated state dump (internal)
      tags:
      - internal
  /tokens:
    get:
      description: Returns pending and recently-burned tokens. Pending token IDs are
        redacted (only an 8-char prefix shown); used tokens show in full because they
        can no longer be replayed. Admin only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agent.ListTokensResponse'
        "401":
          description: Admin auth required
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: List join tokens
      tags:
      - tokens
    post:
      consumes:
      - application/json
      description: Generates a fresh single-use bearer token a new node can pass as
        JETTY_JOIN_TOKEN. Burned on first successful /api/join. Admin only.
      parameters:
      - description: TTL + note (both optional)
        in: body
        name: request
        schema:
          $ref: '#/definitions/agent.CreateTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agent.CreateTokenResponse'
        "401":
          description: Admin auth required
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Mint a one-time join token
      tags:
      - tokens
  /tokens/{id}:
    delete:
      description: Deletes a token by ID. Works on both pending tokens (true revocation)
        and already-burned tokens (just expunges the audit record). Admin only.
      parameters:
      - description: Token ID (the secret value itself)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agent.RevokeTokenResponse'
        "401":
          description: Admin auth required
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Revoke a join token
      tags:
      - tokens
  /tunnel:
    delete:
      description: Default scope=node stops this node's cloudflared connector and
        leaves the cluster token and every other node untouched - use this to pull
        one node out of Cloudflare's load-balancing rotation. scope=cluster clears
        the token everywhere and stops every connector, taking public traffic down
        until a token is set again.
      parameters:
      - description: node (default) or cluster
        in: query
        name: scope
        type: string
      - description: Target node id or name
        in: query
        name: node
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agent.TunnelStatus'
        "400":
          description: Invalid scope
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Detach a node from the tunnel, or remove it cluster-wide
      tags:
      - tunnel
    get:
      description: Returns Cloudflare tunnel status. "configured" is cluster-wide
        (a token is set); "enabled" and "running" are local to this node. Pass ?node=<id|name>
        to query a peer.
      parameters:
      - description: Target node id or name
        in: query
        name: node
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agent.TunnelStatus'
      summary: Get tunnel status
      tags:
      - tunnel
    post:
      consumes:
      - application/json
      description: With scope=cluster (or a body containing a token), sets the Cloudflare
        tunnel token and propagates it to all nodes. With the default scope=node and
        no token, re-attaches this node to the existing cluster token after a scope=node
        delete.
      parameters:
      - description: node (default) or cluster
        in: query
        name: scope
        type: string
      - description: Target node id or name
        in: query
        name: node
        type: string
      - description: Tunnel token (required for scope=cluster)
        in: body
        name: token
        schema:
          $ref: '#/definitions/agent.TunnelRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agent.TunnelStatus'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Configure tunnel or re-enable this node
      tags:
      - tunnel
  /tunnel/sync:
    post:
      consumes:
      - application/json
      description: Node-to-node. Accepts the cluster CFToken from a peer and starts
        or stops cloudflared to match. A node that has opted out via DELETE /tunnel?scope=node
        accepts the token but stays stopped. Peer API key required.
      parameters:
      - description: Cluster tunnel token; empty string tears the tunnel down
        in: body
        name: token
        required: true
        schema:
          $ref: '#/definitions/agent.TunnelRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Receive a tunnel token broadcast (internal)
      tags:
      - internal
  /tunnel/ws:
    get:
      description: Node-to-node WebSocket carrying raw IPv4 packets, used when kernel
        IPIP/GRE tunnels are unavailable (ChromeOS, unprivileged containers). Each
        binary frame is one packet; the receiver proxies it to a local workload and
        returns the response over the same socket. Packets addressed to anything other
        than a local workload are rejected. Peer API key required in X-API-Key.
      responses:
        "101":
          description: Switching Protocols
        "401":
          description: Missing or invalid API key
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Userspace packet tunnel (internal, WebSocket)
      tags:
      - internal
  /workloads:
    get:
      description: Returns all workloads in the cluster, optionally filtered by node
      parameters:
      - description: Filter by node name or ID (use 'local' for this node only)
        in: query
        name: node
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/agent.Workload'
            type: array
      summary: List all workloads
      tags:
      - workloads
    post:
      consumes:
      - application/json
      description: Creates and deploys a new Docker Compose workload with a mesh IP
      parameters:
      - description: Workload configuration
        in: body
        name: workload
        required: true
        schema:
          $ref: '#/definitions/agent.WorkloadRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/agent.Workload'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
        "409":
          description: Mesh IP already in use
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
        "500":
          description: Deployment failed
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Deploy a new workload
      tags:
      - workloads
  /workloads/{name}:
    delete:
      description: Stops and removes a workload from the cluster
      parameters:
      - description: Workload name
        in: path
        name: name
        required: true
        type: string
      responses:
        "204":
          description: Workload deleted
        "404":
          description: Workload not found
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Delete a workload
      tags:
      - workloads
    get:
      description: Returns details for a specific workload by name
      parameters:
      - description: Workload name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agent.Workload'
        "404":
          description: Workload not found
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Get workload details
      tags:
      - workloads
    patch:
      consumes:
      - application/json
      description: Updates workload configuration. Some fields require redeploy.
      parameters:
      - description: Workload name
        in: path
        name: name
        required: true
        type: string
      - description: Fields to update
        in: body
        name: update
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agent.Workload'
        "404":
          description: Workload not found
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
        "409":
          description: Mesh IP conflict
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
        "500":
          description: Update failed
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Update a workload
      tags:
      - workloads
  /workloads/{name}/exec:
    get:
      description: 'Upgrades to a WebSocket and runs docker exec -i -t against the
        workload''s first container (or ?service=X for a specific service). Use ?shell=/bin/bash
        to override the default /bin/sh. Auth: ?api_key=<secret> or X-API-Key header.'
      parameters:
      - description: Workload name
        in: path
        name: name
        required: true
        type: string
      - description: 'Compose service name (default: first container)'
        in: query
        name: service
        type: string
      - description: Shell to exec (default /bin/sh)
        in: query
        name: shell
        type: string
      responses: {}
      summary: Open an interactive shell in a workload container (WebSocket)
      tags:
      - terminal
  /workloads/{name}/logs:
    get:
      description: Returns container logs for a workload
      parameters:
      - description: Workload name
        in: path
        name: name
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: Container logs
          schema:
            type: string
        "404":
          description: Workload not found
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Get workload logs
      tags:
      - workloads
  /workloads/{name}/move:
    post:
      consumes:
      - application/json
      description: Migrates a workload to a different node in the cluster
      parameters:
      - description: Workload name
        in: path
        name: name
        required: true
        type: string
      - description: Target node
        in: body
        name: target
        required: true
        schema:
          $ref: '#/definitions/agent.MoveRequest'
      responses:
        "200":
          description: Workload moved
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
        "404":
          description: Workload or target not found
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Move workload to another node
      tags:
      - workloads
  /workloads/{name}/prepull:
    post:
      description: Asks this node to pull the workload's image into its docker cache.
        Used by other cluster members to warm caches on potential failover targets,
        so failover doesn't have to download images during the outage. Returns immediately;
        the pull runs in the background.
      parameters:
      - description: Workload name
        in: path
        name: name
        required: true
        type: string
      responses:
        "202":
          description: Pre-pull scheduled
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Workload not found in cluster state
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Pre-pull a workload's image on this node
      tags:
      - workloads
  /workloads/{name}/restart:
    post:
      description: Recreates the workload's containers, picking up any config changes
        (env, extra_hosts, image updates that have been pulled). Equivalent to docker
        compose up -d --force-recreate. To pick up a new image, call /workloads/{name}
        PATCH with a new compose first, then /workloads/{name}/restart.
      parameters:
      - description: Workload name
        in: path
        name: name
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Workload not found
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
        "500":
          description: Restart failed
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Restart a workload (force-recreate)
      tags:
      - workloads
  /workloads/{name}/start:
    post:
      description: Starts the containers for a workload that was previously stopped
      parameters:
      - description: Workload name
        in: path
        name: name
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Workload not found
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
        "500":
          description: Start failed
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Start a stopped workload
      tags:
      - workloads
  /workloads/{name}/stop:
    post:
      description: Stops the containers for a workload without removing them
      parameters:
      - description: Workload name
        in: path
        name: name
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Workload not found
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
        "500":
          description: Stop failed
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Stop a running workload
      tags:
      - workloads
  /workloads/bulk:
    post:
      consumes:
      - application/json
      description: Runs start/stop/restart/delete against a set of workloads selected
        by tag, names, or all. Exactly one selector must be set. Returns a per-workload
        result map; remote workloads are proxied to their owner.
      parameters:
      - description: Selector + action
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/agent.BulkRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agent.BulkResponse'
        "400":
          description: Bad selector or action
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Bulk workload action by selector
      tags:
      - workloads
  /workloads/export:
    get:
      description: Returns a portable JSON payload of selected workloads (filtered
        by ?tag=X or ?names=a,b,c, or all when no filter). Includes the list of env-var
        keys referenced in compose YAML so the operator knows what to set on the destination
        cluster. Owner+Version are stripped so the payload imports cleanly anywhere.
      parameters:
      - description: Filter to workloads carrying this tag
        in: query
        name: tag
        type: string
      - description: Comma-separated list of workload names
        in: query
        name: names
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agent.PortableExport'
      summary: Export workloads as JSON
      tags:
      - workloads
  /workloads/import:
    post:
      consumes:
      - application/json
      description: Restores workloads from a payload produced by /api/workloads/export.
        mode controls name-collision handling (skip|replace|fail). reassign_ips (default
        true) auto-allocates a fresh mesh IP when the requested one is taken. Returns
        a per-workload report.
      parameters:
      - description: Mode + payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/agent.ImportRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agent.ImportReport'
        "400":
          description: Invalid mode or payload
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
        "409":
          description: Atomic-fail mode hit a collision
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Import workloads from a previous export
      tags:
      - workloads
schemes:
- https
- http
security:
- ApiKeyAuth: []
securityDefinitions:
  ApiKeyAuth:
    description: API key for authentication (JETTY_SECRET)
    in: header
    name: X-API-Key
    type: apiKey
swagger: "2.0"
