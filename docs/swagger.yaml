basePath: /api
definitions:
  agent.ClusterHealthResponse:
    properties:
      cluster_status:
        example: healthy
        type: string
      healthy_nodes:
        example: 3
        type: integer
      nodes:
        items:
          $ref: '#/definitions/agent.NodeHealth'
        type: array
      timestamp:
        example: "2024-01-02T15:04:05Z"
        type: string
      total_nodes:
        example: 3
        type: integer
      total_workloads:
        example: 10
        type: integer
    type: object
  agent.ErrorResponse:
    properties:
      error:
        example: workload not found
        type: string
    type: object
  agent.HealthResponse:
    properties:
      id:
        example: abc123def456
        type: string
      mesh_ip:
        example: 10.100.0.1
        type: string
      name:
        example: node1
        type: string
      public_ip:
        example: 203.0.113.1
        type: string
      status:
        example: healthy
        type: string
      system:
        additionalProperties: true
        type: object
      timestamp:
        example: "2024-01-02T15:04:05Z"
        type: string
      warp_enabled:
        example: true
        type: boolean
      warp_ip:
        example: 100.96.0.5
        type: string
      workloads_local:
        example:
        - nginx:10.100.50.1:running
        items:
          type: string
        type: array
      workloads_total:
        example: 5
        type: integer
    type: object
  agent.JoinRequest:
    properties:
      id:
        type: string
      mesh_ip:
        type: string
      name:
        type: string
      secret:
        type: string
      tunnel_host:
        type: string
      warp_ip:
        type: string
    type: object
  agent.JoinResponse:
    properties:
      cf_token:
        type: string
      mesh_cidr:
        example: 10.100.0.0/16
        type: string
      peers:
        items:
          $ref: '#/definitions/agent.Peer'
        type: array
      tunnel_domain:
        type: string
      warp_token:
        type: string
      workloads:
        items:
          $ref: '#/definitions/agent.Workload'
        type: array
    type: object
  agent.MoveRequest:
    properties:
      to:
        example: node2
        type: string
    type: object
  agent.NodeHealth:
    properties:
      error:
        type: string
      healthy:
        example: true
        type: boolean
      id:
        example: abc123def456
        type: string
      mesh_ip:
        example: 10.100.0.1
        type: string
      name:
        example: node1
        type: string
      status:
        example: healthy
        type: string
      system:
        additionalProperties: true
        type: object
      workloads:
        items:
          type: string
        type: array
    type: object
  agent.NodeInfo:
    properties:
      id:
        example: abc123def456
        type: string
      mesh_ip:
        example: 10.100.0.1
        type: string
      name:
        example: node1
        type: string
      warp_ip:
        example: 100.96.0.5
        type: string
    type: object
  agent.Peer:
    properties:
      healthy:
        type: boolean
      id:
        description: HWID
        type: string
      last_seen:
        type: string
      mesh_ip:
        description: Mesh network IP
        type: string
      name:
        description: Hostname
        type: string
      tunnel_host:
        description: Peer-specific tunnel hostname (e.g., "node1.cluster.example.com")
        type: string
      warp_ip:
        description: Cloudflare WARP IP (CGNAT range, e.g., "100.96.x.x")
        type: string
    type: object
  agent.StatusResponse:
    properties:
      node:
        $ref: '#/definitions/agent.NodeInfo'
      peers:
        items:
          $ref: '#/definitions/agent.Peer'
        type: array
      tunnel:
        $ref: '#/definitions/agent.TunnelStatus'
      warp:
        $ref: '#/definitions/agent.WarpStatus'
      workloads:
        items:
          $ref: '#/definitions/agent.Workload'
        type: array
    type: object
  agent.TunnelRequest:
    properties:
      token:
        example: eyJhIjoiNjA2...
        type: string
    type: object
  agent.TunnelStatus:
    properties:
      configured:
        example: true
        type: boolean
      running:
        example: true
        type: boolean
    type: object
  agent.WarpStatus:
    properties:
      enabled:
        example: true
        type: boolean
      ip:
        example: 100.96.0.5
        type: string
    type: object
  agent.Workload:
    properties:
      allowed_nodes:
        description: 'Node whitelist: empty/["*"] = all, otherwise node names/IDs'
        items:
          type: string
        type: array
      autostart:
        description: Auto-start when Jetty starts up
        type: boolean
      compose:
        type: string
      mesh_ip:
        description: Unique lock
        type: string
      name:
        description: DNS hostname
        type: string
      owner:
        description: Node HWID
        type: string
      revive:
        description: Auto-failover to another node if owner dies
        type: boolean
      version:
        description: Unix timestamp
        type: integer
    type: object
  agent.WorkloadRequest:
    properties:
      allowed_nodes:
        example:
        - node1
        - node2
        items:
          type: string
        type: array
      autostart:
        example: true
        type: boolean
      compose:
        example: |-
          services:
            web:
              image: nginx
        type: string
      mesh_ip:
        example: 10.100.50.1
        type: string
      name:
        example: nginx
        type: string
      revive:
        example: true
        type: boolean
    type: object
host: localhost:8080
info:
  contact:
    name: Jetty Support
    url: https://github.com/ncwardell/jetty
  description: P2P Docker Compose orchestration with Cloudflare WARP mesh networking
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Jetty API
  version: "2.0"
paths:
  /cluster/health:
    get:
      description: Returns health status from all nodes in the cluster
      parameters:
      - description: Filter by specific node name or ID
        in: query
        name: node
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agent.ClusterHealthResponse'
      summary: Aggregate cluster health
      tags:
      - cluster
  /health:
    get:
      description: Returns health status of this node
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agent.HealthResponse'
      summary: Health check
      tags:
      - cluster
  /join:
    post:
      consumes:
      - application/json
      description: Allows a new node to join the cluster using the cluster secret
      parameters:
      - description: Join request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/agent.JoinRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agent.JoinResponse'
        "401":
          description: Invalid secret
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
        "409":
          description: Mesh IP collision
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Join cluster
      tags:
      - cluster
  /status:
    get:
      description: Returns full cluster status including node info, peers, workloads,
        and connectivity status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agent.StatusResponse'
      summary: Get cluster status
      tags:
      - cluster
  /tunnel:
    delete:
      description: Removes the Cloudflare tunnel configuration
      responses:
        "204":
          description: Tunnel removed
      summary: Remove tunnel
      tags:
      - tunnel
    get:
      description: Returns Cloudflare tunnel configuration status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agent.TunnelStatus'
      summary: Get tunnel status
      tags:
      - tunnel
    post:
      consumes:
      - application/json
      description: Sets the Cloudflare tunnel token (propagates to all nodes)
      parameters:
      - description: Tunnel token
        in: body
        name: token
        required: true
        schema:
          $ref: '#/definitions/agent.TunnelRequest'
      responses:
        "200":
          description: Tunnel configured
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Configure tunnel
      tags:
      - tunnel
  /workloads:
    get:
      description: Returns all workloads in the cluster, optionally filtered by node
      parameters:
      - description: Filter by node name or ID (use 'local' for this node only)
        in: query
        name: node
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/agent.Workload'
            type: array
      summary: List all workloads
      tags:
      - workloads
    post:
      consumes:
      - application/json
      description: Creates and deploys a new Docker Compose workload with a mesh IP
      parameters:
      - description: Workload configuration
        in: body
        name: workload
        required: true
        schema:
          $ref: '#/definitions/agent.WorkloadRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/agent.Workload'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
        "409":
          description: Mesh IP already in use
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
        "500":
          description: Deployment failed
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Deploy a new workload
      tags:
      - workloads
  /workloads/{name}:
    delete:
      description: Stops and removes a workload from the cluster
      parameters:
      - description: Workload name
        in: path
        name: name
        required: true
        type: string
      responses:
        "204":
          description: Workload deleted
        "404":
          description: Workload not found
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Delete a workload
      tags:
      - workloads
    get:
      description: Returns details for a specific workload by name
      parameters:
      - description: Workload name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agent.Workload'
        "404":
          description: Workload not found
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Get workload details
      tags:
      - workloads
    patch:
      consumes:
      - application/json
      description: Updates workload configuration. Some fields require redeploy.
      parameters:
      - description: Workload name
        in: path
        name: name
        required: true
        type: string
      - description: Fields to update
        in: body
        name: update
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/agent.Workload'
        "404":
          description: Workload not found
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
        "409":
          description: Mesh IP conflict
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
        "500":
          description: Update failed
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Update a workload
      tags:
      - workloads
  /workloads/{name}/logs:
    get:
      description: Returns container logs for a workload
      parameters:
      - description: Workload name
        in: path
        name: name
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: Container logs
          schema:
            type: string
        "404":
          description: Workload not found
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Get workload logs
      tags:
      - workloads
  /workloads/{name}/move:
    post:
      consumes:
      - application/json
      description: Migrates a workload to a different node in the cluster
      parameters:
      - description: Workload name
        in: path
        name: name
        required: true
        type: string
      - description: Target node
        in: body
        name: target
        required: true
        schema:
          $ref: '#/definitions/agent.MoveRequest'
      responses:
        "200":
          description: Workload moved
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
        "404":
          description: Workload or target not found
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Move workload to another node
      tags:
      - workloads
  /workloads/{name}/start:
    post:
      description: Starts the containers for a workload that was previously stopped
      parameters:
      - description: Workload name
        in: path
        name: name
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Workload not found
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
        "500":
          description: Start failed
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Start a stopped workload
      tags:
      - workloads
  /workloads/{name}/stop:
    post:
      description: Stops the containers for a workload without removing them
      parameters:
      - description: Workload name
        in: path
        name: name
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Workload not found
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
        "500":
          description: Stop failed
          schema:
            $ref: '#/definitions/agent.ErrorResponse'
      summary: Stop a running workload
      tags:
      - workloads
schemes:
- http
- https
swagger: "2.0"
