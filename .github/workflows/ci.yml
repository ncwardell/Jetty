name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 'stable' rather than go-version-file: go.mod. The go directive is a
      # minimum (1.25.0), and building against it would ship known-patched
      # stdlib CVEs -- govulncheck below flags 27 of them on 1.25.2 alone.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./agent ./main.go)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d ./agent ./main.go
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race + coverage)
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: |
          go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Dashboard embed is in sync
        # agent/dashboard.html is a go:generate copy of web-ui/index.html.
        # Nothing enforces it at build time, so a dirty tree can ship a stale
        # dashboard. Catch the drift here until the two files are collapsed
        # into one (see ROADMAP.md, Phase 3).
        run: |
          if ! diff -q web-ui/index.html agent/dashboard.html; then
            echo "::error::agent/dashboard.html is out of sync with web-ui/index.html. Run: go generate ./..."
            exit 1
          fi

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
